[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultpos"
version = "0.2.0"
description = "Offline-first AES-256-GCM encrypted point-of-sale vault and 80mm thermal receipt engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
vaultpos = "vaultpos.cli:main"

[tool.setuptools.packages.find]
include = ["vaultpos*"]
